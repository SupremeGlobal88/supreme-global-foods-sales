name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          npm install --no-audit --no-fund --prefer-offline
          echo "Install completed"
        continue-on-error: true

      - name: Verify install
        run: |
          ls node_modules/.bin/vite 2>/dev/null && echo "vite installed" || echo "vite NOT installed"
          ls node_modules/.bin/wrangler 2>/dev/null && echo "wrangler installed" || echo "wrangler NOT installed"

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npx vite build 2>&1 | tee build-output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED WITH EXIT CODE $BUILD_EXIT ==="
            cat build-output.log
            exit $BUILD_EXIT
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.log

      - name: List dist files
        if: always()
        run: |
          echo "Dist folder contents:"
          ls -la dist/ || echo "No dist folder"

      - name: Deploy to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying with wrangler..."
          npx wrangler pages deploy dist --project-name=supreme-global-foods-sales --branch=main --commit-dirty=true
