<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGF Delete Corrupted Orders</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0D0E;color:#E8E8E9;font-family:Arial,sans-serif;padding:20px;line-height:1.5}
.container{max-width:900px;margin:0 auto}
h1{color:#D4A843;font-size:22px;margin-bottom:5px}
h2{color:#D4A843;font-size:16px;margin-top:20px;margin-bottom:8px;border-bottom:1px solid #2A2B2C;padding-bottom:5px}
p{color:#8A8B8C;font-size:13px;margin-bottom:10px}
.card{background:#131415;border:1px solid #2A2B2C;border-radius:10px;padding:16px;margin-bottom:16px}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;transition:opacity 0.2s;width:100%;margin-top:10px}
button:hover{opacity:0.85}
.btn-primary{background:#D4A843;color:#0C0D0E}
.btn-secondary{background:#2A2B2C;color:#E8E8E9;border:1px solid #3A3B3C}
.btn-danger{background:#EF4444;color:#fff}
pre{background:#1A1B1C;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:#8A8B8C;max-height:300px;overflow:auto;white-space:pre-wrap}
.status-ok{color:#4ADE80}
.status-warn{color:#F59E0B}
.status-error{color:#EF4444}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th{text-align:left;color:#D4A843;padding:5px 4px;border-bottom:1px solid #2A2B2C;font-size:10px}
td{padding:4px;border-bottom:1px solid #1A1B1C}
</style>
</head>
<body>
<div class="container">
<h1>Delete Corrupted Orders (2026/10/05)</h1>
<p>This tool finds and deletes the corrupted orders from <strong>2026/10/05</strong> that show "R NaN".</p>

<div class="card">
<p style="color:#8A8B8C;font-size:12px;margin-bottom:10px">
<strong style="color:#D4A843">Target customers:</strong> Kasi Casing Supplies, Superspar Diepkloof, Helens Casings, Roots - Daveyton
</p>
<button class="btn-primary" onclick="scanCorrupted()">1. Scan for Corrupted Orders</button>
<div id="scanResults" style="margin-top:10px"></div>
</div>

<div class="card" id="deleteCard" style="display:none">
<button class="btn-danger" onclick="deleteCorrupted()">2. DELETE These Orders from localStorage</button>
<button class="btn-secondary" onclick="pushToCloud()">3. Push Cleaned Data to Firebase</button>
<pre id="log" style="margin-top:10px"></pre>
</div>

</div>

<script>
let ordersToDelete = [];
let cleanedOrders = [];
let allOrders = [];

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + "\n";
}

function isOct5(dateStr) {
  if (!dateStr) return false;
  const s = String(dateStr);
  return s.startsWith("2026-10-05") || s.startsWith("2026/10/05") || s.includes("2026-10-05") || s.includes("2026/10/05");
}

function scanCorrupted() {
  const el = document.getElementById('scanResults');
  el.innerHTML = '';
  document.getElementById('log').textContent = '';

  allOrders = JSON.parse(localStorage.getItem('sgf_orders') || '[]');

  if (!Array.isArray(allOrders)) {
    el.innerHTML = '<p class="status-error">ERROR: Orders data is not an array. Type: ' + (typeof allOrders) + '</p>';
    return;
  }

  const targetCustomers = ["Kasi Casing Supplies", "Superspar Diepkloof", "Helens Casings", "Roots - Daveyton"];
  ordersToDelete = [];

  for (let i = 0; i < allOrders.length; i++) {
    const o = allOrders[i];
    if (!o) continue;

    const isTarget = targetCustomers.includes(o.customerName);
    const isOctFive = isOct5(o.createdAt);
    const total = o.total;
    const isBad = total === undefined || total === null || Number.isNaN(Number(total));

    if (isTarget && isOctFive && isBad) {
      ordersToDelete.push({
        index: i,
        id: o.id,
        orderNumber: o.orderNumber || "NO INVOICE",
        customerName: o.customerName || "Unknown",
        priceTier: o.priceTier || "",
        createdAt: o.createdAt,
        itemCount: (o.items || []).length,
        total: total,
        status: o.status || ""
      });
    }
  }

  if (ordersToDelete.length === 0) {
    el.innerHTML = '<p class="status-error">No corrupted orders found.</p>' +
      '<p style="font-size:11px;color:#666">Checked ' + allOrders.length + ' orders. ' +
      'Looking for customer names: ' + targetCustomers.join(", ") + '<br>' +
      'Date must contain 2026-10-05 or 2026/10/05, and total must be null/undefined/NaN.</p>';
    return;
  }

  let html = '<h2>Found ' + ordersToDelete.length + ' Corrupted Order(s)</h2>';
  html += '<table><thead><tr><th>#</th><th>Order #</th><th>Customer</th><th>Tier</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>';
  ordersToDelete.forEach((o, idx) => {
    html += '<tr><td>' + (idx + 1) + '</td><td>' + o.orderNumber + '</td><td>' + o.customerName + '</td><td>' + o.priceTier + '</td><td>' + o.itemCount + '</td><td class="status-error">R ' + o.total + '</td><td>' + (o.status || "-") + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<p style="margin-top:8px;font-size:12px">Total orders: ' + allOrders.length + '</p>';
  el.innerHTML = html;
  document.getElementById('deleteCard').style.display = 'block';
}

function deleteCorrupted() {
  if (ordersToDelete.length === 0) return;

  const idsToDelete = new Set(ordersToDelete.map(o => o.id));
  const originalCount = allOrders.length;
  cleanedOrders = allOrders.filter(o => !idsToDelete.has(o?.id));
  const deletedCount = originalCount - cleanedOrders.length;

  localStorage.setItem('sgf_orders', JSON.stringify(cleanedOrders));

  log("=== DELETED " + deletedCount + " CORRUPTED ORDERS ===");
  ordersToDelete.forEach((o, idx) => {
    log((idx + 1) + ". [ID: " + o.id + "] " + o.customerName + " | " + o.priceTier + " | " + (o.status || "no status"));
  });
  log("");
  log("Orders before: " + originalCount);
  log("Orders after:  " + cleanedOrders.length);
  log("");
  log("Next: Click 'Push Cleaned Data to Firebase' to sync.");
}

function pushToCloud() {
  log("\nPushing to Firebase...");

  const script = document.createElement('script');
  script.src = "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js";
  script.onload = function() {
    const script2 = document.createElement('script');
    script2.src = "https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js";
    script2.onload = function() {
      try {
        const config = {
          apiKey: "AIzaSyAj68G-CmO9ImmBB5MgPwlas389gHWqPu8",
          authDomain: "supreme-global-foods-835b0.firebaseapp.com",
          databaseURL: "https://supreme-global-foods-835b0-default-rtdb.firebaseio.com",
          projectId: "supreme-global-foods-835b0"
        };
        const app = firebase.apps.length > 0 ? firebase.apps[0] : firebase.initializeApp(config);
        const db = firebase.database();
        const orders = JSON.parse(localStorage.getItem('sgf_orders') || '[]');
        db.ref('sgf_orders').set(orders).then(() => {
          log("SUCCESS: Pushed cleaned orders to Firebase!");
          log("Please go back to the Orders page and refresh.");
        }).catch(e => {
          log("ERROR: " + e.message);
        });
      } catch(e) {
        log("ERROR: " + e.message);
      }
    };
    document.head.appendChild(script2);
  };
  document.head.appendChild(script);
}
</script>
</body>
</html>
