name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          npm ci --no-audit --no-fund 2>&1 | tee npm-install.log
          echo "Install completed"

      - name: Upload npm install log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-log
          path: npm-install.log

      - name: Verify install
        run: |
          ls node_modules/.bin/vite 2>/dev/null && echo "vite installed" || (echo "vite NOT installed"; exit 1)
          ls node_modules/.bin/wrangler 2>/dev/null && echo "wrangler installed" || echo "wrangler NOT installed"

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: List dist files
        if: always()
        run: |
          echo "Dist folder contents:"
          ls -la dist/ || echo "No dist folder"

      - name: Deploy to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying with wrangler..."
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name=supreme-global-foods-sales --branch=main --commit-dirty=true
