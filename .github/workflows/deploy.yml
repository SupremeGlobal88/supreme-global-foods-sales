name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          echo "Starting build..."
          npm run build 2>&1
          echo "Build exit code: $?"

      - name: List dist files
        if: always()
        run: |
          echo "Dist folder contents:"
          ls -la dist/ || echo "No dist folder"
          echo "---"
          ls -la dist/assets/ || echo "No assets folder"

      - name: Deploy to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying with wrangler..."
          npx wrangler pages deploy dist --project-name=supreme-global-foods-sales --branch=main --commit-dirty=true
