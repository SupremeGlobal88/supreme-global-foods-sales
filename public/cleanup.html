<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SGF Order Cleanup</title>
<style>
body{background:#0C0D0E;color:#E8E8E9;font-family:Arial;padding:20px}
h1{color:#D4A843;font-size:20px}
p,li{color:#8A8B8C;font-size:13px}
.card{background:#131415;border:1px solid #2A2B2C;border-radius:10px;padding:16px;margin:16px 0;max-width:900px}
.ok{color:#4ADE80}.err{color:#EF4444}.warn{color:#F59E0B}
button{background:#D4A843;color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:bold;cursor:pointer;margin-top:10px}
table{font-size:12px;width:100%;margin-top:10px}
th{color:#D4A843;text-align:left;border-bottom:1px solid #333;padding:4px}
td{padding:4px;border-bottom:1px solid #1A1B1C}
</style>
</head>
<body>
<h1>SGF Order Cleanup Tool</h1>
<div id="main" class="card">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<script>
const TARGETS = ["Kasi Casing Supplies","Superspar Diepkloof","Helens Casings","Roots - Daveyton"];
const el = document.getElementById('main');

function run() {
  let orders;
  try {
    const raw = localStorage.getItem('sgf_orders');
    if (!raw) { el.innerHTML = '<p class="err">No sgf_orders in localStorage.</p>'; return; }
    let decompressed;
    try { decompressed = LZString.decompressFromUTF16(raw); if (!decompressed) decompressed = LZString.decompress(raw); } catch(e) {}
    orders = decompressed ? JSON.parse(decompressed) : JSON.parse(raw);
  } catch(e) { el.innerHTML = '<p class="err">ERROR: ' + e.message + '</p>'; return; }

  if (!Array.isArray(orders)) { el.innerHTML = '<p class="err">Not an array.</p>'; return; }

  // 1. ALL Oct 5 orders (any customer)
  const oct5All = [];
  for (let i = 0; i < orders.length; i++) {
    const o = orders[i]; if (!o) continue;
    const date = String(o.createdAt || o.date || '');
    if (date.indexOf('2026-10-05') !== -1 || date.indexOf('2026/10/05') !== -1 || date.indexOf('2026-10-05') !== -1) {
      oct5All.push({i:i, id:o.id, name:o.customerName||'?', num:o.orderNumber||'NO INVOICE', tier:o.priceTier||'', date:date, total:o.total, status:o.status||'', items:(o.items||[]).length});
    }
  }

  // 2. Target customers (any date)
  const targetAll = [];
  for (let i = 0; i < orders.length; i++) {
    const o = orders[i]; if (!o) continue;
    if (TARGETS.indexOf(o.customerName) !== -1) {
      targetAll.push({i:i, id:o.id, name:o.customerName, num:o.orderNumber||'NO INVOICE', tier:o.priceTier||'', date:String(o.createdAt||o.date||''), total:o.total, status:o.status||'', items:(o.items||[]).length});
    }
  }

  // 3. NaN totals (any date, any customer)
  const nanOrders = [];
  for (let i = 0; i < orders.length; i++) {
    const o = orders[i]; if (!o) continue;
    const t = o.total;
    if (t === undefined || t === null || t !== t) {
      nanOrders.push({i:i, id:o.id, name:o.customerName||'?', num:o.orderNumber||'NO INVOICE', tier:o.priceTier||'', date:String(o.createdAt||o.date||''), total:t, status:o.status||'', items:(o.items||[]).length});
    }
  }

  let html = '<p>Total orders: <strong>' + orders.length + '</strong></p>';

  // Section 1: All Oct 5
  html += '<h2 style="color:#D4A843;font-size:16px;margin-top:15px">All Orders from 2026-10-05 (' + oct5All.length + ')</h2>';
  if (oct5All.length === 0) {
    html += '<p class="err">None found with createdAt/date containing 2026-10-05</p>';
  } else {
    html += makeTable(oct5All);
  }

  // Section 2: Target customers
  html += '<h2 style="color:#D4A843;font-size:16px;margin-top:15px">Target Customers (any date) (' + targetAll.length + ')</h2>';
  if (targetAll.length === 0) {
    html += '<p class="err">None found</p>';
  } else {
    html += makeTable(targetAll);
  }

  // Section 3: NaN totals
  html += '<h2 style="color:#D4A843;font-size:16px;margin-top:15px">Orders with NaN/Null/Undefined Total (' + nanOrders.length + ')</h2>';
  if (nanOrders.length === 0) {
    html += '<p class="ok">None found</p>';
  } else {
    html += makeTable(nanOrders);
    html += '<button onclick="deleteNaN()">DELETE ALL ' + nanOrders.length + ' NaN ORDERS</button>';
  }

  // Section 4: Oct 5 + Target combined
  const combined = oct5All.filter(o => TARGETS.indexOf(o.name) !== -1);
  html += '<h2 style="color:#D4A843;font-size:16px;margin-top:15px">Oct 5 + Target Customers (' + combined.length + ')</h2>';
  if (combined.length > 0) {
    html += makeTable(combined);
    html += '<button onclick="deleteCombined()">DELETE THESE ' + combined.length + ' ORDERS</button>';
  } else {
    html += '<p class="err">None found</p>';
  }

  el.innerHTML = html;
  window._orders = orders;
  window._nanOrders = nanOrders;
  window._combined = combined;
  window._oct5All = oct5All;
}

function makeTable(rows) {
  let h = '<table><thead><tr><th>#</th><th>Idx</th><th>Order#</th><th>Customer</th><th>Tier</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>';
  rows.forEach((r, i) => {
    const tc = (r.total === undefined || r.total === null || r.total !== r.total) ? 'err' : 'ok';
    h += '<tr><td>' + (i+1) + '</td><td>' + r.i + '</td><td>' + r.num + '</td><td>' + r.name + '</td><td>' + r.tier + '</td><td>' + r.date.substring(0,19) + '</td><td>' + r.items + '</td><td class="' + tc + '">R ' + r.total + '</td><td>' + (r.status||'-') + '</td></tr>';
  });
  h += '</tbody></table>';
  return h;
}

function deleteNaN() {
  const orders = window._orders;
  const toDel = window._nanOrders;
  const ids = {}; toDel.forEach(d => ids[d.id] = true);
  const before = orders.length;
  const cleaned = orders.filter(o => !ids[o.id]);
  const deleted = before - cleaned.length;
  const compressed = LZString.compressToUTF16(JSON.stringify(cleaned));
  localStorage.setItem('sgf_orders', compressed);
  el.innerHTML = '<p class="ok">Deleted ' + deleted + ' NaN orders. Before: ' + before + ' After: ' + cleaned.length + '</p><button onclick="pushFB()" style="background:#2A2B2C;color:#fff;border:1px solid #444">Push to Firebase</button>';
  window._cleaned = cleaned;
}

function deleteCombined() {
  const orders = window._orders;
  const toDel = window._combined;
  const ids = {}; toDel.forEach(d => ids[d.id] = true);
  const before = orders.length;
  const cleaned = orders.filter(o => !ids[o.id]);
  const deleted = before - cleaned.length;
  const compressed = LZString.compressToUTF16(JSON.stringify(cleaned));
  localStorage.setItem('sgf_orders', compressed);
  el.innerHTML = '<p class="ok">Deleted ' + deleted + ' combined orders. Before: ' + before + ' After: ' + cleaned.length + '</p><button onclick="pushFB()" style="background:#2A2B2C;color:#fff;border:1px solid #444">Push to Firebase</button>';
  window._cleaned = cleaned;
}

function pushFB() {
  const s = document.createElement('script');
  s.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
  s.onload = function() {
    const s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js';
    s2.onload = function() {
      firebase.initializeApp({
        apiKey:'AIzaSyAj68G-CmO9ImmBB5MgPwlas389gHWqPu8',
        authDomain:'supreme-global-foods-835b0.firebaseapp.com',
        databaseURL:'https://supreme-global-foods-835b0-default-rtdb.firebaseio.com',
        projectId:'supreme-global-foods-835b0'
      });
      const data = window._cleaned || JSON.parse(LZString.decompressFromUTF16(localStorage.getItem('sgf_orders')));
      firebase.database().ref('sgf_orders').set(data).then(() => {
        el.innerHTML += '<p class="ok">SUCCESS! Pushed to Firebase. Go refresh Orders page.</p>';
      }).catch(e => { el.innerHTML += '<p class="err">Push failed: ' + e.message + '</p>'; });
    };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
}

if (typeof LZString !== 'undefined') run();
else window.addEventListener('load', function() { setTimeout(run, 500); });
</script>
</body>
</html>
