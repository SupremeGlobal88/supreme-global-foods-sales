name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          echo "Install completed"

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: List dist files
        if: always()
        run: |
          echo "Dist folder contents:"
          ls -la dist/ || echo "No dist folder"

      - name: Deploy to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying with wrangler..."
          npx wrangler pages deploy dist --project-name=supreme-global-foods-sales --branch=main --commit-dirty=true
