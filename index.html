<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Supreme Sales Command</title>
    <script>
      // ═══════════════════════════════════════════════════════════════
      // CRITICAL: Auto-reload on version change — runs BEFORE JS bundle
      // ═══════════════════════════════════════════════════════════════
      window.SGF_APP_VERSION="2026-08-25-stable-v24";
      (function(){
        var stored = localStorage.getItem("sgf_app_version");
        var current = window.SGF_APP_VERSION;
        if (stored && stored !== current) {
          // Version mismatch — WIPE ALL cached sgf_* data and reload
          var keysToRemove = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && (k.indexOf("sgf_") === 0 || k.indexOf("trpc-") === 0 || k.indexOf("react-query-") === 0)) {
              keysToRemove.push(k);
            }
          }
          keysToRemove.forEach(function(k){ localStorage.removeItem(k); });
          localStorage.setItem("sgf_app_version", current);
          var url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
          return; // Stop everything, page is reloading
        }
        localStorage.setItem("sgf_app_version", current);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Unregister any service workers that might cache old versions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    </script>
  </body>
</html>
