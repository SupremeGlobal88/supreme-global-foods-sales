<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Supreme Sales Command</title>
    <script>
      // ═══════════════════════════════════════════════════════════════
      // CRITICAL: Version gate + cache purge — runs BEFORE anything else
      // ═══════════════════════════════════════════════════════════════
      window.SGF_APP_VERSION="2026-08-25-stable-v28";
      (function(){
        var current = window.SGF_APP_VERSION;
        var stored = localStorage.getItem("sgf_app_version");

        // ALWAYS purge React Query / tRPC cache on every load (safe, fast)
        var purgeKeys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && (k.indexOf("trpc-") === 0 || k.indexOf("react-query-") === 0)) {
            purgeKeys.push(k);
          }
        }
        purgeKeys.forEach(function(k){ localStorage.removeItem(k); });

        // ALWAYS purge stale sgf data keys that contain old cached records
        // (users list, products, invoices — these will re-sync from Firebase)
        var staleDataKeys = ["sgf_users","sgf_products","sgf_invoices","sgf_orders","sgf_creditNotes","sgf_customers","sgf_stockItems"];
        staleDataKeys.forEach(function(k){ localStorage.removeItem(k); });

        // Version mismatch: force hard reload with cache-buster
        if (stored && stored !== current) {
          localStorage.setItem("sgf_app_version", current);
          var url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
          return;
        }
        localStorage.setItem("sgf_app_version", current);
      })();

      // Detect back-forward cache (bfcache) restore and force reload
      window.addEventListener("pageshow", function(e) {
        if (e.persisted) {
          window.location.reload();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Aggressively nuke any service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        // Also clear caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
      }
    </script>
  </body>
</html>
